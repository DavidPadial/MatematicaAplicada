//
// Página de inicio y comportamiento inicial
lockPref("browser.startup.homepage", "https://www.uma.es");
lockPref("browser.shell.checkDefaultBrowser", false);

// Actualizaciones silenciosas, sin credenciales de administrador y sin cerrar Firefox
lockPref("app.update.auto", true);
lockPref("app.update.service.enabled", true);
lockPref("app.update.silent", true);
lockPref("app.update.staging.enabled", true);

// No guardar contraseñas
lockPref("signon.rememberSignons", false);

// Borrar historial web, búsquedas/formularios, cookies, sesiones y caché al cerrar
lockPref("privacy.sanitize.sanitizeOnShutdown", true);

// Compatibilidad con versiones anteriores de Firefox
lockPref("privacy.clearOnShutdown.history", true);
lockPref("privacy.clearOnShutdown.formdata", true);
lockPref("privacy.clearOnShutdown.cookies", true);
lockPref("privacy.clearOnShutdown.sessions", true);
lockPref("privacy.clearOnShutdown.cache", true);

// Compatibilidad con Firefox 128+ / ESR actuales
lockPref("privacy.clearOnShutdown_v2.browsingHistoryAndDownloads", true);
lockPref("privacy.clearOnShutdown_v2.formdata", true);
lockPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);
lockPref("privacy.clearOnShutdown_v2.cache", true);

// Bloquear proxy en modo "Usar la configuración de proxy del sistema"
lockPref("network.proxy.type", 5);